# Defines the actual AWS EKS cluster using eksctl (the simplest official
# way to create an EKS cluster — one YAML file instead of hand-writing
# Terraform/CloudFormation). This REPLACES the local `kind` cluster from
# docs/setup.md — same Kubernetes concepts, but now real AWS infrastructure
# that costs money while it's running.
#
# Create it with:
#   eksctl create cluster -f cluster.yaml
# Tear it down with (IMPORTANT — this is what stops the billing):
#   eksctl delete cluster -f cluster.yaml
apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: compass-prod
  region: us-east-1
  version: "1.30"

# Small, cheap node group to start. t3.medium is enough to run the demo
# app, compass, Prometheus/Grafana/Loki, and Argo CD/Rollouts together.
# Scale up nodeGroups or add a second one once you have real traffic.
nodeGroups:
  - name: compass-workers
    instanceType: t3.medium
    desiredCapacity: 2
    minSize: 2
    maxSize: 4
    volumeSize: 20
    ssh:
      allow: false   # no SSH access needed; manage via kubectl instead

# Required so pods (like compass and the AWS Load Balancer Controller)
# can call AWS APIs (e.g. to create the actual Application Load Balancer
# behind the Ingress) without static AWS credentials baked into the pod.
iam:
  withOIDC: true
