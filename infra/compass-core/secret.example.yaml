# DO NOT commit a filled-in copy of this to git. This is a template --
# copy it, fill in your real key, apply it, and keep the filled copy
# out of version control (it matches nothing in .gitignore by default
# because it lives outside core/, so name your real file
# secret.local.yaml and add that pattern to .gitignore if you go this route).
#
# Apply with:
#   kubectl create secret generic compass-core-secrets \
#     --from-literal=ANTHROPIC_API_KEY=sk-ant-your-real-key \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# The manifest below is just for reference/documentation of what keys
# the Deployment expects via envFrom.
apiVersion: v1
kind: Secret
metadata:
  name: compass-core-secrets
type: Opaque
stringData:
  ANTHROPIC_API_KEY: "sk-ant-REPLACE-ME"
  CLAUDE_MODEL: "claude-haiku-4-5"
