apiVersion: apps/v1
kind: Deployment
metadata:
  name: compass-core
  namespace: compass-apps
  labels:
    app: compass-core
spec:
  replicas: 1
  selector:
    matchLabels:
      app: compass-core
  template:
    metadata:
      labels:
        app: compass-core
    spec:
      serviceAccountName: compass-core
      containers:
      - name: compass-core
        image: 606196119399.dkr.ecr.eu-north-1.amazonaws.com/compass-core:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          name: http
        envFrom:
        - secretRef:
            name: compass-core-secrets
        env:
        - name: PROMETHEUS_URL
          value: "http://kube-prometheus-kube-prome-prometheus.monitoring.svc.cluster.local:9090"
        - name: LOKI_URL
          value: "http://loki.monitoring.svc.cluster.local:3100"
        - name: K8S_NAMESPACE
          value: "compass-apps"
        - name: DATABASE_URL
          value: "sqlite:////data/compass.db"
        volumeMounts:
        - name: db-storage
          mountPath: /data
        readinessProbe:
          httpGet:
            path: / # <-- Updated from /health to /
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
      volumes:
      - name: db-storage
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: compass-core
  namespace: compass-apps
  labels:
    app: compass-core
spec:
  selector:
    app: compass-core
  ports:
  - name: http
    port: 8000
    targetPort: 8000
  type: ClusterIP
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: compass-core
  namespace: compass-apps
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: compass-core
  namespace: compass-apps
rules:
- apiGroups: [ "" ]
  resources: [ "pods", "events", "services" ]
  verbs: [ "get", "list", "watch" ]
- apiGroups: [ "apps" ]
  resources: [ "deployments" ]
  verbs: [ "get", "list", "watch", "patch" ]
- apiGroups: [ "argoproj.io" ]
  resources: [ "rollouts" ]
  verbs: [ "get", "list", "watch", "patch" ]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: compass-core
  namespace: compass-apps
subjects:
- kind: ServiceAccount
  name: compass-core
  namespace: compass-apps
roleRef:
  kind: Role
  name: compass-core
  apiGroup: rbac.authorization.k8s.io
