# Runs the compass orchestrator (core/) AS A WORKLOAD INSIDE THE CLUSTER,
# instead of as a process on your laptop.
#
# Why you'd want this instead of local `uvicorn`:
#   - It gets a stable in-cluster DNS name other things can call, e.g.
#     an Argo CD PostSync hook: http://compass-core.default.svc.cluster.local:8000
#   - It uses the in-cluster ServiceAccount to talk to the K8s API instead
#     of your local kubeconfig -- closer to how it'd run in production.
#   - Prometheus/Loki are reachable by their in-cluster Service DNS names
#     directly (no port-forwarding needed) -- see the env vars below.
#
# Why you might NOT want this for local dev: iterating on core/app/*.py
# requires a full rebuild + `kind load docker-image` cycle instead of
# just `uvicorn --reload`. For active development, run it locally per
# docs/setup.md and only deploy it in-cluster once the logic is stable
# or you need something else in the cluster to call it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: compass-core
  labels:
    app: compass-core
spec:
  replicas: 1
  selector:
    matchLabels:
      app: compass-core
  template:
    metadata:
      labels:
        app: compass-core
    spec:
      serviceAccountName: compass-core
      containers:
        - name: compass-core
          image: compass-core:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - secretRef:
                name: compass-core-secrets   # holds ANTHROPIC_API_KEY, see below
          env:
            # In-cluster DNS names -- no port-forward needed once compass
            # itself runs inside the cluster (contrast with .env.example,
            # which uses localhost:9090 / localhost:3100 for local dev).
            - name: PROMETHEUS_URL
              value: "http://kube-prometheus-kube-prome-prometheus.monitoring.svc.cluster.local:9090"
            - name: LOKI_URL
              value: "http://loki.monitoring.svc.cluster.local:3100"
            - name: K8S_NAMESPACE
              value: "default"
            - name: DATABASE_URL
              value: "sqlite:////data/compass.db"
          volumeMounts:
            - name: db-storage
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: db-storage
          emptyDir: {}   # swap for a PersistentVolumeClaim if you want incident history to survive pod restarts
---
# Stable in-cluster endpoint. Anything inside the cluster reaches compass at:
#   http://compass-core.default.svc.cluster.local:8000
apiVersion: v1
kind: Service
metadata:
  name: compass-core
  labels:
    app: compass-core
spec:
  selector:
    app: compass-core
  ports:
    - name: http
      port: 8000
      targetPort: 8000
  type: ClusterIP
---
# Minimal ServiceAccount + RBAC so compass can read pod status, events,
# and trigger rollbacks via the in-cluster K8s API (this is what
# k8s_client.py's load_incluster_config() authenticates as).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: compass-core
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: compass-core
  namespace: default
rules:
  - apiGroups: [""]
    resources: ["pods", "events", "services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["argoproj.io"]
    resources: ["rollouts"]
    verbs: ["get", "list", "watch", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: compass-core
  namespace: default
subjects:
  - kind: ServiceAccount
    name: compass-core
    namespace: default
roleRef:
  kind: Role
  name: compass-core
  apiGroup: rbac.authorization.k8s.io
