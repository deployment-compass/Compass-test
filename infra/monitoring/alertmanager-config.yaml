apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: monitoring
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m

    route:
      group_by: ['alertname', 'service']
      group_wait: 10s
      group_interval: 30s
      repeat_interval: 12h
      receiver: 'action-engine-and-slack'

    receivers:
      - name: 'action-engine-and-slack'
        webhook_configs:
          # Dispatches webhook directly to the NestJS Action Engine
          - url: 'http://compass-core.default.svc.cluster.local:8080/api/v1/action-engine/alert'
            send_resolved: true
        slack_configs:
          # Sends incident warnings to team Slack channel
          - channel: '#incidents-alerts'
            api_url: 'https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK'
            send_resolved: true
            text: " *Alert:* {{ .CommonAnnotations.summary }}\n*Description:* {{ .CommonAnnotations.description }}"
