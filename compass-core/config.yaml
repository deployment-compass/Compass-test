# Human-readable mirror of key tunables (the actual runtime source of
# truth is .env / environment variables — this file is for documentation
# and for any external tooling that wants to read thresholds as YAML).
thresholds:
  rollback_confidence: 75
  human_review_confidence: 40
  error_rate_hard: 0.05
  layer2_deviation_fail: 0.5
  layer2_deviation_warn: 0.2

safety_policy:
  max_auto_rollbacks_per_hour: 3
  freeze_window: null   # e.g. ["22:00", "06:00"]

soak_window_seconds: 120
