#
# Loaded by Loki's ruler (see loki-config.yaml: ruler.storage.local.directory).
# Same two-group split as test_compass_prometheus_rules.yml, same label
# scheme (test_compass_event_type / test_compass_trigger), pointed at the
# SAME Alertmanager — so the Trigger dispatcher's webhook receiver sees one
# consistent alert_fired stream no matter which engine fired it.
#
# 1. test_compass-log-recording-rules
#    Metric-ified log signals —
#    for Layer 2 anomaly checks that want a
#    log-derived series, not just http_requests_total.
#
# 2. test_compass-log-alert-rules
#    LogQL-only signals: things that show up as a specific line in the logs
#    before (or instead of) tripping a metric threshold.
#

groups:
  - name: test_compass-log-recording-rules
    interval: 30s
    rules:
      # Exception/traceback rate per service — complements
      # test_compass:service:error_rate_5m, catches errors that don't
      # surface as 5xx (e.g. caught exceptions, background job failures)
      - record: test_compass:service:log_exception_rate_5m
        expr: |
          sum by (service) (
            count_over_time({job=~".+"} |= "Traceback" [5m])
          )

      # Fatal/panic rate per service — process-level distress signal,
      # often precedes a CrashLoopBackOff by a few seconds
      - record: test_compass:service:log_fatal_rate_5m
        expr: |
          sum by (service) (
            count_over_time({job=~".+"} |~ "(?i)fatal|panic" [5m])
          )

      # rolling baseline inputs, same pattern as the Prometheus recording
      # rules — lets Layer 2 treat log-derived series the same way it
      # treats metric series
      - record: test_compass:service:log_exception_rate_5m:avg_1h
        expr: avg_over_time(test_compass:service:log_exception_rate_5m[1h])
      - record: test_compass:service:log_exception_rate_5m:stddev_1h
        expr: stddev_over_time(test_compass:service:log_exception_rate_5m[1h])

  - name: test_compass-log-alert-rules
    rules:
      # Repeated exception pattern — a burst of tracebacks for one service.
      # This is context Prometheus counters alone won't give you: the
      # actual failure signature, not just a rate.
      - alert: test_compassRepeatedExceptionPattern
        expr: test_compass:service:log_exception_rate_5m > 10
        for: 2m
        labels:
          severity: warning
          test_compass_event_type: alert_fired
          test_compass_trigger: log_exception_pattern
        annotations:
          summary: 'Repeated exceptions in logs for {{ $labels.service }}'
          description: '{{ $labels.service }} logged {{ $value }} exception traces over 5m.'

      # Fatal/panic burst — often fires seconds before k8s notices via
      # CrashLoopBackOff, giving Layer 1 an earlier signal
      - alert: test_compassFatalLogBurst
        expr: test_compass:service:log_fatal_rate_5m > 3
        for: 1m
        labels:
          severity: critical
          test_compass_event_type: alert_fired
          test_compass_trigger: log_fatal_burst
        annotations:
          summary: 'Fatal/panic log burst for {{ $labels.service }}'
          description: '{{ $labels.service }} logged {{ $value }} fatal/panic lines over 5m.'

      # OOM signal from application logs — complements the k8s-native
      # kube_pod_container_status_last_terminated_reason=OOMKilled alert;
      # this one can catch memory pressure the app itself reports before
      # the kernel OOM-killer acts
      - alert: test_compassOOMLogSignal
        expr: |
          sum by (service) (
            count_over_time({job=~".+"} |~ "(?i)out of memory|oom" [5m])
          ) > 0
        for: 1m
        labels:
          severity: critical
          test_compass_event_type: alert_fired
          test_compass_trigger: oom_log_signal
        annotations:
          summary: 'Out-of-memory signal in logs for {{ $labels.service }}'
          description: '{{ $labels.service }} logged OOM-related messages in the last 5m.'

      # Database/dependency connection errors — a class of failure that
      # rarely trips an HTTP error-rate threshold cleanly but shows up
      # unambiguously in logs
      - alert: test_compassDependencyConnectionErrors
        expr: |
          sum by (service) (
            count_over_time({job=~".+"} |~ "(?i)connection refused|connection reset|could not connect" [5m])
          ) > 15
        for: 2m
        labels:
          severity: warning
          test_compass_event_type: alert_fired
          test_compass_trigger: dependency_connection_errors
        annotations:
          summary: 'Dependency connection errors for {{ $labels.service }}'
          description: '{{ $labels.service }} logged {{ $value }} connection-error lines over 5m.'

      # --- Synthetic / test-only rule ---------------------------------
      # Mirrors test_compassSyntheticStormTrigger in the Prometheus rules —
      # drive log lines containing this flag to load-test the alert-storm
      # handler's log-sourced path the same way the metric-sourced one is
      # tested.
      - alert: test_compassSyntheticLogStormTrigger
        expr: |
          sum by (service) (
            count_over_time({job=~".+"} |= "test_compass_test_storm_flag=1" [1m])
          ) > 0
        for: 0s
        labels:
          severity: warning
          test_compass_event_type: alert_fired
          test_compass_trigger: synthetic_storm_test
        annotations:
          summary: 'Synthetic log storm-test alert for {{ $labels.service }}'
          description: 'Fired because a log line contained test_compass_test_storm_flag=1 — used to load-test the alert-storm handler.'
