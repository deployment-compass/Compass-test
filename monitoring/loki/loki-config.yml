# loki-config.yml — minimal single-node/filesystem config, fine for local
# dev and training data collection.

auth_enabled: false

server:
  http_listen_port: 3100

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  # Keep label cardinality in check — matches the "low-cardinality labels
  # only" rule in logger.config.ts (service label, not correlation_id)
  max_label_names_per_series: 15
