global:
  scrape_interval: 5s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  - job_name: compass-test
    static_configs:
      - targets:
          - server:3000

  # cadvisor and node-exporter run as DaemonSets (one pod per node), so we
  # discover them through the Kubernetes API instead of a static hostname -
  # this is also what attaches namespace/pod/container labels to the series.
  - job_name: cadvisor
    kubernetes_sd_configs:
      - role: pod
        namespaces:
            names: [compass]
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        regex: cadvisor
        action: keep
      - source_labels: [__address__]
        regex: '(.+):\d+'
        target_label: __address__
        replacement: '${1}:8080'
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
      - source_labels: [__meta_kubernetes_pod_container_name]
        target_label: container
      - source_labels: [__meta_kubernetes_pod_node_name]
        target_label: node

  - job_name: node-exporter
    kubernetes_sd_configs:
      - role: pod
        namespaces:
            names: [compass]
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        regex: node-exporter
        action: keep
      - source_labels: [__address__]
        regex: '(.+):\d+'
        target_label: __address__
        replacement: '${1}:9100'
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
      - source_labels: [__meta_kubernetes_pod_container_name]
        target_label: container
      - source_labels: [__meta_kubernetes_pod_node_name]
        target_label: node

rule_files:
  - /etc/prometheus/rules.yml