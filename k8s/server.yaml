apiVersion: apps/v1
kind: Deployment
metadata:
  name: server
  namespace: compass
  labels:
    app: server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: server
  template:
    metadata:
      labels:
        app: server
    spec:
      containers:
        - name: server
          # built from the repo root Dockerfile (compose "build: context: .")
          # build + push, then update this image reference (or set via `kustomize edit set image`)
          image: omarmohamed04/compass-server:latest
          imagePullPolicy: Always

          env:
            - name: SERVICE_NAME
              value: compass
            - name: LOKI_URL
              value: http://loki:3100
          ports:
            - containerPort: 3000

          resources:
            requests:
              memory: "4Gi"
              cpu: "1000m"
              ephemeral-storage: "1Gi"
            limits:
              memory: "10Gi"
              cpu: "2000m"
              ephemeral-storage: "2Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: server
  namespace: compass
spec:
  selector:
    app: server
  ports:
    - port: 3000
      targetPort: 3000
  type: ClusterIP
