apiVersion: apps/v1
kind: Deployment
metadata:
  name: compass
  namespace: compass
  labels:
    app: compass
spec:
  replicas: 1
  selector:
    matchLabels:
      app: compass
  template:
    metadata:
      labels:
        app: compass
    spec:
      containers:
        - name: compass
          # built from ./compass Dockerfile (compose "build: context: ./compass")
          image: omarmohamed04/compass:latest
          env:
            - name: COMPASS_PROMETHEUS_URL
              value: http://prometheus:9090
            - name: COMPASS_LOKI_URL
              value: http://loki:3100
            - name: COMPASS_REDIS_URL
              value: redis://redis:6379/0
            - name: COMPASS_RABBITMQ_URL
              value: amqp://guest:guest@rabbitmq:5672/
          ports:
            - containerPort: 8000


---
apiVersion: v1
kind: Service
metadata:
  name: compass
  namespace: compass
spec:
  selector:
    app: compass
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP
