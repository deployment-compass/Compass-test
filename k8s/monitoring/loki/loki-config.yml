# loki-config.yml — minimal single-node/filesystem config, fine for local
# dev and training data collection.

auth_enabled: false

server:
  http_listen_port: 3100
common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

# --- Ruler: this is what lets Loki fire alerts the same way Prometheus does.
# LogQL rules below get evaluated on an interval and pushed to the SAME
# Alertmanager that Prometheus rules.yml already points to, so Compass's
# Trigger dispatcher sees one alert_fired stream regardless of origin.
ruler:
  storage:
    type: local
    local:
      directory: /loki/rules
  rule_path: /tmp/loki/rules-temp
  alertmanager_url: http://alertmanager:9093
  enable_alertmanager_v2: true
  enable_api: true
  evaluation_interval: 30s
  poll_interval: 30s

limits_config:
  retention_period: 336h # 14 days — tune to your storage budget
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  # Needed for count_over_time / rate LogQL used in the alert rules below
  max_query_series: 10000
  per_stream_rate_limit: 5MB
  per_stream_rate_limit_burst: 20MB

compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  delete_request_store: filesystem

analytics:
  reporting_enabled: false
