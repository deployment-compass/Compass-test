name: Deploy & Trigger Compass

on:
  workflow_dispatch:
    inputs:
      previous_revision:
        description: "Previous stable revision/tag"
        required: true
  push:
    branches: [main]

env:
  AWS_REGION: eu-north-1

jobs:
  deploy-and-notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Build & Push NestJS Core App
          docker build -t $ECR_REGISTRY/compass-core:$IMAGE_TAG -t $ECR_REGISTRY/compass-core:latest .
          docker push $ECR_REGISTRY/compass-core:$IMAGE_TAG
          docker push $ECR_REGISTRY/compass-core:latest

      - name: Notify Compass
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          PAYLOAD=$(jq -n \
            --arg app "compass-core" \
            --arg ns "compass-apps" \
            --arg new_rev "${{ github.sha }}" \
            --arg prev_rev "${{ github.event.inputs.previous_revision || 'unknown' }}" \
            --arg sha "${{ github.sha }}" \
            --arg msg "$COMMIT_MSG" \
            --arg actor "${{ github.actor }}" \
            '{
              app_name: $app,
              namespace: $ns,
              new_revision: $new_rev,
              previous_revision: $prev_rev,
              commit_sha: $sha,
              commit_message: $msg,
              triggered_by: $actor
            }')

          curl -X POST "${{ secrets.COMPASS_URL }}/deploy-hook" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"